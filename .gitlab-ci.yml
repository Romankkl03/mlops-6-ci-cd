stages:
  - greeting
  - test

greet:
  stage: greeting
  image: python:3.8
  script:
    -echo "Hello! My name is $MY_LOGIN. My password is $MY_PASSWORD."

lint:
  stage: test
  :image: python:3.8
  script:
    - pip install flake8
    - flake8 .
  allow_failure: true
  rules:
    - if $CI_MERGE_REQUEST_TARGET_BRANCH == "master"

unit_tests:
  stage: test
  image: python:3.8
  script:
    - pip install -r requirements.txt
    - pytest tests/unit
  rules:
    - if $CI_MERGE_REQUEST_TARGET_BRANCH == "master"

integration_tests:
  stage: test
  image: python:3.8
  script:
    - pip install -r requirements.txt
    - pytest tests/integration
  needs:
    - unit_tests
  when: manual